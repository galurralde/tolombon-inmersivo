<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tolombón Inmersivo AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      .mensaje {
        position: fixed;
        top: 20px;
        left: 0;
        width: 100%;

        text-align: center;

        color: white;
        font-size: 20px;

        text-shadow:
          0 0 5px black,
          0 0 10px black;

        z-index: 9999;

        pointer-events: none;
      }

      .estado {
        position: fixed;
        bottom: 25px;
        left: 50%;

        transform: translateX(-50%);

        background: rgba(0, 0, 0, 0.65);
        color: white;

        padding: 10px 16px;

        border-radius: 10px;

        font-size: 14px;
        text-align: center;

        z-index: 9999;

        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div class="mensaje">Apuntá la cámara a uno de los marcadores</div>

    <div class="estado" id="estado">Buscando marcador...</div>

    <!-- ========================= -->
    <!-- AUDIOS -->
    <!-- ========================= -->

    <audio id="audio1" src="/ar/parada1/audio1.mp3" preload="auto"></audio>

    <audio id="audio2" src="/ar/parada2/audio2.mp3" preload="auto"></audio>

    <audio id="audio3" src="/ar/parada3/audio3.mp3" preload="auto"></audio>

    <audio id="audio4" src="/ar/parada4/audio4.mp3" preload="auto"></audio>

    <!-- ========================= -->
    <!-- ESCENA AR -->
    <!-- ========================= -->

    <a-scene
      mindar-image="
      imageTargetSrc: /ar/targets.mind;
      autoStart: true;
    "
      color-space="sRGB"
      renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- ========================= -->
      <!-- ILUMINACIÓN -->
      <!-- ========================= -->

      <a-entity
        light="
        type: ambient;
        intensity: 1.8;
      "
      ></a-entity>

      <a-entity
        light="
        type: directional;
        intensity: 2;
      "
        position="1 2 1"
      ></a-entity>

      <!-- ========================= -->
      <!-- CÁMARA -->
      <!-- ========================= -->

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ================================================= -->
      <!-- PARADA 1 -->
      <!-- targetIndex 0 -->
      <!-- ================================================= -->

      <a-entity id="target1" mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="modelo1"
          src="/ar/parada1/modelo1.glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.02 0.02 0.02"
        ></a-gltf-model>
      </a-entity>

      <!-- ================================================= -->
      <!-- PARADA 2 -->
      <!-- targetIndex 1 -->
      <!-- ================================================= -->

      <a-entity id="target2" mindar-image-target="targetIndex: 1">
        <a-gltf-model
          id="modelo2"
          src="/ar/parada2/modelo2.glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.02 0.02 0.02"
        ></a-gltf-model>
      </a-entity>

      <!-- ================================================= -->
      <!-- PARADA 3 -->
      <!-- targetIndex 2 -->
      <!-- ================================================= -->

      <a-entity id="target3" mindar-image-target="targetIndex: 2">
        <a-gltf-model
          id="modelo3"
          src="/ar/parada3/modelo3.glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.02 0.02 0.02"
        ></a-gltf-model>
      </a-entity>

      <!-- ================================================= -->
      <!-- PARADA 4 -->
      <!-- targetIndex 3 -->
      <!-- ================================================= -->

      <a-entity id="target4" mindar-image-target="targetIndex: 3">
        <a-gltf-model
          id="modelo4"
          src="/ar/parada1/modelo1.glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.02 0.02 0.02"
        ></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const estado = document.getElementById("estado");

        /* ============================================
         AUDIOS
      ============================================ */

        const audio1 = document.getElementById("audio1");

        const audio2 = document.getElementById("audio2");

        const audio3 = document.getElementById("audio3");

        const audio4 = document.getElementById("audio4");

        const audios = [audio1, audio2, audio3, audio4];

        /* ============================================
         TARGETS
      ============================================ */

        const target1 = document.getElementById("target1");

        const target2 = document.getElementById("target2");

        const target3 = document.getElementById("target3");

        const target4 = document.getElementById("target4");

        /* ============================================
         MODELOS
      ============================================ */

        const modelo1 = document.getElementById("modelo1");

        const modelo2 = document.getElementById("modelo2");

        const modelo3 = document.getElementById("modelo3");

        const modelo4 = document.getElementById("modelo4");

        /* ============================================
         DETENER TODOS LOS AUDIOS
      ============================================ */

        function detenerAudios() {
          audios.forEach((audio) => {
            audio.pause();
            audio.currentTime = 0;
          });
        }

        /* ============================================
         REPRODUCIR AUDIO
      ============================================ */

        function reproducirAudio(audio) {
          detenerAudios();

          audio.currentTime = 0;

          audio
            .play()
            .then(() => {
              console.log("🔊 Audio reproduciendo");
            })
            .catch((error) => {
              console.warn("Audio bloqueado:", error);
            });
        }

        /* ============================================
         MODELO 1
      ============================================ */

        modelo1.addEventListener("model-loaded", () => {
          console.log("✅ modelo1.glb cargado");
        });

        modelo1.addEventListener("model-error", (event) => {
          console.error("❌ Error modelo1.glb", event);
        });

        /* ============================================
         MODELO 2
      ============================================ */

        modelo2.addEventListener("model-loaded", () => {
          console.log("✅ modelo2.glb cargado");
        });

        modelo2.addEventListener("model-error", (event) => {
          console.error("❌ Error modelo2.glb", event);
        });

        /* ============================================
         MODELO 3
      ============================================ */

        modelo3.addEventListener("model-loaded", () => {
          console.log("✅ modelo3.glb cargado");
        });

        modelo3.addEventListener("model-error", (event) => {
          console.error("❌ Error modelo3.glb", event);
        });

        /* ============================================
         MODELO 4
      ============================================ */

        modelo4.addEventListener("model-loaded", () => {
          console.log("✅ modelo4.glb cargado");
        });

        modelo4.addEventListener("model-error", (event) => {
          console.error("❌ Error modelo4.glb", event);
        });

        /* ============================================
         PARADA 1
      ============================================ */

        target1.addEventListener("targetFound", () => {
          console.log("🎯 PARADA 1 DETECTADA");

          estado.textContent = "Parada 1 detectada";

          reproducirAudio(audio1);
        });

        target1.addEventListener("targetLost", () => {
          console.log("Parada 1 perdida");

          audio1.pause();

          estado.textContent = "Buscando marcador...";
        });

        /* ============================================
         PARADA 2
      ============================================ */

        target2.addEventListener("targetFound", () => {
          console.log("🎯 PARADA 2 DETECTADA");

          estado.textContent = "Parada 2 detectada";

          reproducirAudio(audio2);
        });

        target2.addEventListener("targetLost", () => {
          console.log("Parada 2 perdida");

          audio2.pause();

          estado.textContent = "Buscando marcador...";
        });

        /* ============================================
         PARADA 3
      ============================================ */

        target3.addEventListener("targetFound", () => {
          console.log("🎯 PARADA 3 DETECTADA");

          estado.textContent = "Parada 3 detectada";

          reproducirAudio(audio3);
        });

        target3.addEventListener("targetLost", () => {
          console.log("Parada 3 perdida");

          audio3.pause();

          estado.textContent = "Buscando marcador...";
        });

        /* ============================================
   TARGET INDEX 3 = PARADA 1
============================================ */

        target4.addEventListener("targetFound", () => {
          console.log("🎯 PARADA 1 DETECTADA");

          estado.textContent = "Parada 1 detectada";

          reproducirAudio(audio1);
        });

        target4.addEventListener("targetLost", () => {
          console.log("Parada 1 fuera de cámara - experiencia continúa");

          estado.textContent = "Experiencia Parada 1 activa";
        });
      });
    </script>
  </body>
</html>
