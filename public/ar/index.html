<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tolombón Inmersivo AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Model Viewer: visor 3D independiente de MindAR -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      .mensaje {
        position: fixed;
        top: 20px;
        left: 0;
        width: 100%;

        text-align: center;

        color: white;
        font-size: 20px;

        text-shadow:
          0 0 5px black,
          0 0 10px black;

        z-index: 9999;

        pointer-events: none;
      }

      .estado {
        position: fixed;
        bottom: 25px;
        left: 50%;

        transform: translateX(-50%);

        background: rgba(0, 0, 0, 0.65);
        color: white;

        padding: 10px 16px;

        border-radius: 10px;

        font-size: 14px;
        text-align: center;

        z-index: 9999;

        pointer-events: none;
      }
    
    /* ==========================================
       VISOR 3D PERSISTENTE
       Se muestra después de detectar Parada 1
       y NO depende del tracking del marcador.
    ========================================== */

    .modelo-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      pointer-events: none;
    }

    .modelo-overlay.activo {
      display: flex;
    }

    .modelo-card {
      position: relative;
      width: min(92vw, 620px);
      height: min(68vh, 620px);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      overflow: hidden;
      pointer-events: auto;
    }

    #modeloParada1 {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    .cerrar-modelo {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(54, 37, 19, 0.88);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .ayuda-modelo {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 2;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }

  </style>
  </head>

  <body>
    <div class="mensaje">Apuntá la cámara a uno de los marcadores</div>

    <div class="estado" id="estado">Buscando marcador...</div>

    <!-- Visor 3D persistente: aparece luego del escaneo de Parada 1 -->
    <div id="modeloOverlay" class="modelo-overlay">
      <div class="modelo-card">
        <button id="cerrarModelo" class="cerrar-modelo" type="button">
          ✕ Cerrar modelo
        </button>

        <model-viewer
          id="modeloParada1"
          src="/ar/parada1/modelo1.glb"
          alt="Modelo 3D interpretativo de la Parada 1"
          camera-controls
          auto-rotate
          interaction-prompt="none"
          shadow-intensity="1"
          exposure="1.2"
          loading="eager"
          reveal="auto">
        </model-viewer>

        <div class="ayuda-modelo">
          Arrastrá para girar · Pellizcá para acercar
        </div>
      </div>
    </div>

    <!-- ========================= -->
    <!-- AUDIOS -->
    <!-- ========================= -->

    <audio id="audio1" src="/ar/parada1/audio1.mp3" preload="auto"></audio>

    <audio id="audio2" src="/ar/parada2/audio2.mp3" preload="auto"></audio>

    <audio id="audio3" src="/ar/parada3/audio3.mp3" preload="auto"></audio>

    <audio id="audio4" src="/ar/parada4/audio4.mp3" preload="auto"></audio>

    <!-- ========================= -->
    <!-- ESCENA AR -->
    <!-- ========================= -->

    <a-scene
      mindar-image="
      imageTargetSrc: /ar/targets.mind;
      autoStart: true;
    "
      color-space="sRGB"
      renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- ========================= -->
      <!-- ILUMINACIÓN -->
      <!-- ========================= -->

      <a-entity
        light="
        type: ambient;
        intensity: 1.8;
      "
      ></a-entity>

      <a-entity
        light="
        type: directional;
        intensity: 2;
      "
        position="1 2 1"
      ></a-entity>

      <!-- ========================= -->
      <!-- CÁMARA -->
      <!-- ========================= -->

      <a-camera
        id="camera"
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>

      <!-- ================================================= -->
      <!-- PARADA 1 -->
      <!-- targetIndex 0 -->
      <!-- ================================================= -->

      <a-entity id="target1" mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="modelo1"
          src="/ar/parada1/modelo1.glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.02 0.02 0.02"
        ></a-gltf-model>
      </a-entity>

      <!-- ================================================= -->
      <!-- PARADA 2 -->
      <!-- targetIndex 1 -->
      <!-- ================================================= -->

      <a-entity id="target2" mindar-image-target="targetIndex: 1">
        <a-gltf-model
          id="modelo2"
          src="/ar/parada2/modelo2.glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.02 0.02 0.02"
        ></a-gltf-model>
      </a-entity>

      <!-- ================================================= -->
      <!-- PARADA 3 -->
      <!-- targetIndex 2 -->
      <!-- ================================================= -->

      <a-entity id="target3" mindar-image-target="targetIndex: 2">
        <a-gltf-model
          id="modelo3"
          src="/ar/parada3/modelo3.glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.02 0.02 0.02"
        ></a-gltf-model>
      </a-entity>

      <!-- ================================================= -->
      <!-- PARADA 4 -->
      <!-- targetIndex 3 -->
      <!-- ================================================= -->

      <a-entity id="target4" mindar-image-target="targetIndex: 3"></a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const estado = document.getElementById("estado");
        const modeloOverlay = document.getElementById("modeloOverlay");
        const modeloParada1 = document.getElementById("modeloParada1");
        const cerrarModelo = document.getElementById("cerrarModelo");


        /* ============================================
         AUDIOS
      ============================================ */

        const audio1 = document.getElementById("audio1");

        const audio2 = document.getElementById("audio2");

        const audio3 = document.getElementById("audio3");

        const audio4 = document.getElementById("audio4");

        const audios = [audio1, audio2, audio3, audio4];

        /* ============================================
         TARGETS
      ============================================ */

        const target1 = document.getElementById("target1");

        const target2 = document.getElementById("target2");

        const target3 = document.getElementById("target3");

        const target4 = document.getElementById("target4");

        /* ============================================
         MODELOS
      ============================================ */

        const modelo1 = document.getElementById("modelo1");

        const modelo2 = document.getElementById("modelo2");

        const modelo3 = document.getElementById("modelo3");

        // modelo4 se retiró del targetIndex 3 porque la Parada 1
        // ahora usa un modelo persistente ligado a la cámara.

        /* ============================================
         DETENER TODOS LOS AUDIOS
      ============================================ */

        function detenerAudios() {
          audios.forEach((audio) => {
            audio.pause();
            audio.currentTime = 0;
          });
        }

        /* ============================================
         REPRODUCIR AUDIO
      ============================================ */

        function reproducirAudio(audio) {
          detenerAudios();

          audio.currentTime = 0;

          audio
            .play()
            .then(() => {
              console.log("🔊 Audio reproduciendo");
            })
            .catch((error) => {
              console.warn("Audio bloqueado:", error);
            });
        }

        /* ============================================
         MODELO 1
      ============================================ */

        modelo1.addEventListener("model-loaded", () => {
          console.log("✅ modelo1.glb cargado");
        });

        modelo1.addEventListener("model-error", (event) => {
          console.error("❌ Error modelo1.glb", event);
        });

        /* ============================================
         MODELO 2
      ============================================ */

        modelo2.addEventListener("model-loaded", () => {
          console.log("✅ modelo2.glb cargado");
        });

        modelo2.addEventListener("model-error", (event) => {
          console.error("❌ Error modelo2.glb", event);
        });

        /* ============================================
         MODELO 3
      ============================================ */

        modelo3.addEventListener("model-loaded", () => {
          console.log("✅ modelo3.glb cargado");
        });

        modelo3.addEventListener("model-error", (event) => {
          console.error("❌ Error modelo3.glb", event);
        });

        /* ============================================
         MODEL-VIEWER - PARADA 1
      ============================================ */

        modeloParada1.addEventListener("load", () => {
          console.log("✅ modelo1.glb cargado en model-viewer");
        });

        modeloParada1.addEventListener("error", (event) => {
          console.error("❌ Error cargando modelo1.glb en model-viewer", event);
          estado.textContent = "Parada 1 activa - error en modelo 3D";
        });

        function ocultarGuiasEscaneo() {
          const scanningUI = document.querySelector(".mindar-ui-scanning");

          if (scanningUI) {
            scanningUI.style.display = "none";
          }
        }

        function mostrarGuiasEscaneo() {
          const scanningUI = document.querySelector(".mindar-ui-scanning");

          if (scanningUI) {
            scanningUI.style.display = "";
          }
        }

        cerrarModelo.addEventListener("click", () => {
          modeloOverlay.classList.remove("activo");

          // Al cerrar el modelo, vuelve el lector para poder escanear otra parada.
          mostrarGuiasEscaneo();

          estado.textContent = "Buscando marcador...";
        });

        /* ============================================
         PARADA 1
      ============================================ */

        target1.addEventListener("targetFound", () => {
          console.log("🎯 PARADA 1 DETECTADA");

          estado.textContent = "Parada 1 detectada";

          reproducirAudio(audio1);
        });

        target1.addEventListener("targetLost", () => {
          console.log("Parada 1 perdida");

          audio1.pause();

          estado.textContent = "Buscando marcador...";
        });

        /* ============================================
         PARADA 2
      ============================================ */

        target2.addEventListener("targetFound", () => {
          console.log("🎯 PARADA 2 DETECTADA");

          estado.textContent = "Parada 2 detectada";

          reproducirAudio(audio2);
        });

        target2.addEventListener("targetLost", () => {
          console.log("Parada 2 perdida");

          audio2.pause();

          estado.textContent = "Buscando marcador...";
        });

        /* ============================================
         PARADA 3
      ============================================ */

        target3.addEventListener("targetFound", () => {
          console.log("🎯 PARADA 3 DETECTADA");

          estado.textContent = "Parada 3 detectada";

          reproducirAudio(audio3);
        });

        target3.addEventListener("targetLost", () => {
          console.log("Parada 3 perdida");

          audio3.pause();

          estado.textContent = "Buscando marcador...";
        });

        /* ============================================
   TARGET INDEX 3 = PARADA 1
============================================ */

        target4.addEventListener("targetFound", () => {
          console.log("🎯 PARADA 1 DETECTADA");

          estado.textContent = "Parada 1 detectada";

          // Mostrar el modelo 3D en una capa independiente del tracking.
          modeloOverlay.classList.add("activo");

          // Ocultar las líneas/guías de escaneo mientras la experiencia está activa.
          ocultarGuiasEscaneo();

          // El audio continúa aunque se pierda el marcador.
          reproducirAudio(audio1);
        });

        target4.addEventListener("targetLost", () => {
          console.log("Parada 1 fuera de cámara - experiencia continúa");

          // No pausamos audio1 y no ocultamos el visor.
          estado.textContent = "Experiencia Parada 1 activa";
        });
      });
    </script>
  </body>
</html>
