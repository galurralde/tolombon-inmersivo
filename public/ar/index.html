<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Tolombón Inmersivo AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body{
      margin:0;
      overflow:hidden;
    }

    .mensaje{
      position:fixed;
      top:20px;
      width:100%;
      text-align:center;
      color:white;
      font-size:22px;
      font-family:Arial, sans-serif;
      text-shadow:0 0 10px black;
      z-index:999;
    }
  </style>
</head>

<body>

<div class="mensaje">
  Apuntá la cámara al marcador Guerrero
</div>

<a-scene
  mindar-image="imageTargetSrc: /ar/targets.mind; autoStart: true;"
  color-space="sRGB"
  embedded
  renderer="physicallyCorrectLights: true; colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-assets>

    <a-asset-item
      id="personaje"
      src="/ar/personaje.glb">
    </a-asset-item>

    <audio
      id="narracion"
      src="/ar/personaje.mp3">
    </audio>

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model
      src="#personaje"
      position="0 0 0"
      rotation="0 180 0"
      scale="0.2 0.2 0.2">
    </a-gltf-model>

  </a-entity>

</a-scene>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const target =
    document.querySelector('[mindar-image-target]');

  const audio =
    document.getElementById("narracion");

  target.addEventListener("targetFound", () => {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  });

});
</script>

</body>
</html>
