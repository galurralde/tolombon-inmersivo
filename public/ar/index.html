<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Tolombón Inmersivo AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
    }

    .mensaje {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;

      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;

      text-shadow:
        0 0 5px black,
        0 0 10px black;

      z-index: 9999;

      pointer-events: none;
    }

    .estado {
      position: fixed;
      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      background: rgba(0, 0, 0, 0.65);
      color: white;

      padding: 10px 15px;
      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      z-index: 9999;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="mensaje">
    Apuntá la cámara al marcador Guerrero
  </div>

  <div
    class="estado"
    id="estado"
  >
    Iniciando cámara...
  </div>


  <audio
    id="narracion"
    src="/ar/personaje.mp3"
    preload="auto"
  ></audio>


  <a-scene
    id="escena"

    mindar-image="
      imageTargetSrc: /ar/targets.mind;
      autoStart: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- ILUMINACIÓN -->

    <a-entity
      light="
        type: ambient;
        intensity: 1.5
      "
    ></a-entity>

    <a-entity
      light="
        type: directional;
        intensity: 2
      "
      position="1 2 1"
    ></a-entity>


    <!-- CÁMARA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- TARGET -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >


      <!-- CUBO DE PRUEBA -->

      <a-box
        position="0 0.25 0"
        width="0.25"
        height="0.25"
        depth="0.25"
        color="#A3732F"
      ></a-box>


      <!-- MODELO -->

      <a-gltf-model
        id="modelo"

        src="/ar/personaje.glb"

        position="0 0 0.1"

        rotation="0 180 0"

        scale="0.02 0.02 0.02"
      ></a-gltf-model>


    </a-entity>

  </a-scene>


  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const target =
        document.getElementById("target");

      const modelo =
        document.getElementById("modelo");

      const audio =
        document.getElementById("narracion");

      const estado =
        document.getElementById("estado");


      modelo.addEventListener(
        "model-loaded",
        () => {

          console.log(
            "✅ GLB cargado"
          );

          estado.textContent =
            "Modelo 3D cargado";

        }
      );


      modelo.addEventListener(
        "model-error",
        (event) => {

          console.error(
            "❌ Error GLB",
            event
          );

          estado.textContent =
            "Error cargando modelo 3D";

        }
      );


      target.addEventListener(
        "targetFound",
        () => {

          console.log(
            "🎯 Marcador detectado"
          );

          estado.textContent =
            "Marcador detectado";

          audio.currentTime = 0;

          audio
            .play()
            .catch(() => {});

        }
      );


      target.addEventListener(
        "targetLost",
        () => {

          estado.textContent =
            "Buscando marcador...";

        }
      );

    });

  </script>

</body>

</html>
