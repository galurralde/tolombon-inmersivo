<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Tolombón Inmersivo AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .mensaje {
      position: fixed;
      top: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 18px;
      text-shadow: 0 2px 6px black;
      z-index: 9999;
      pointer-events: none;
    }

    .estado {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);

      min-width: 220px;

      padding: 10px 16px;

      background: rgba(0, 0, 0, 0.65);
      color: white;

      border-radius: 10px;

      text-align: center;
      font-size: 14px;

      z-index: 9999;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="mensaje">
    Apuntá la cámara al marcador Guerrero
  </div>

  <div class="estado" id="estado">
    Iniciando cámara...
  </div>


  <!--
  =====================================================
  AUDIO FUERA DE A-ASSETS
  =====================================================
  -->

  <audio
    id="narracion"
    src="/ar/personaje.mp3"
    preload="auto"
  ></audio>


  <!--
  =====================================================
  ESCENA AR
  =====================================================
  -->

  <a-scene
    id="escena"

    mindar-image="
      imageTargetSrc: /ar/targets.mind;
      autoStart: true;
      filterMinCF: 0.001;
      filterBeta: 0.01;
      missTolerance: 5;
      warmupTolerance: 5;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    loading-screen="enabled: false"
  >


    <!--
    =====================================================
    ILUMINACIÓN
    =====================================================
    -->

    <a-light
      type="ambient"
      intensity="2"
    ></a-light>

    <a-light
      type="directional"
      intensity="2"
      position="1 2 1"
    ></a-light>


    <!--
    =====================================================
    CÁMARA AR
    =====================================================
    -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!--
    =====================================================
    TARGET MINDAR
    =====================================================
    -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >


      <!--
      =================================================
      CUBO DE CONTROL

      Este cubo tiene que aparecer sí o sí cuando
      MindAR reconoce el marcador.
      =================================================
      -->

      <a-box
        id="cuboPrueba"

        position="0 0.25 0"

        width="0.25"
        height="0.25"
        depth="0.25"

        material="
          color: #A3732F;
          roughness: 0.6;
          metalness: 0;
        "
      ></a-box>


      <!--
      =================================================
      PERSONAJE GLB

      IMPORTANTE:
      ya NO está dentro de <a-assets>

      Por lo tanto NO BLOQUEA el inicio de la cámara.
      =================================================
      -->

      <a-gltf-model
        id="modelo"

        src="/ar/personaje.glb"

        position="0 0 0"

        rotation="0 180 0"

        scale="0.02 0.02 0.02"

        visible="true"
      ></a-gltf-model>


    </a-entity>

  </a-scene>


  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const escena =
        document.getElementById("escena");

      const target =
        document.getElementById("target");

      const modelo =
        document.getElementById("modelo");

      const audio =
        document.getElementById("narracion");

      const estado =
        document.getElementById("estado");


      /* ============================================
         A-FRAME LISTO
      ============================================ */

      escena.addEventListener("loaded", () => {

        console.log("✅ A-Frame cargado");

        estado.textContent =
          "Cámara iniciada - buscá el marcador";

      });


      /* ============================================
         GLB CARGADO
      ============================================ */

      modelo.addEventListener("model-loaded", () => {

        console.log(
          "✅ personaje.glb cargado correctamente"
        );

      });


      /* ============================================
         ERROR GLB
      ============================================ */

      modelo.addEventListener("model-error", (event) => {

        console.error(
          "❌ Error cargando personaje.glb",
          event
        );

        estado.textContent =
          "AR activo - modelo 3D no disponible";

      });


      /* ============================================
         MARCADOR ENCONTRADO
      ============================================ */

      target.addEventListener("targetFound", () => {

        console.log(
          "🎯 Marcador Guerrero detectado"
        );

        estado.textContent =
          "Marcador detectado";


        /* AUDIO */

        audio.currentTime = 0;

        audio.play()
          .then(() => {

            console.log(
              "🔊 Audio reproduciéndose"
            );

          })
          .catch((error) => {

            console.warn(
              "Audio bloqueado:",
              error
            );

          });

      });


      /* ============================================
         MARCADOR PERDIDO
      ============================================ */

      target.addEventListener("targetLost", () => {

        console.log(
          "🔎 Marcador perdido"
        );

        estado.textContent =
          "Buscando marcador...";

      });

    });

  </script>

</body>

</html>
