<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Tolombón Inmersivo AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .mensaje {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;

      color: white;
      font-size: 20px;
      font-family: Arial, sans-serif;

      text-shadow:
        0 0 5px black,
        0 0 10px black;

      z-index: 999;
    }

    .estado {
      position: fixed;
      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      background: rgba(0,0,0,.65);
      color: white;

      padding: 10px 16px;
      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      z-index: 999;
    }
  </style>
</head>

<body>

  <div class="mensaje">
    Apuntá la cámara al marcador Guerrero
  </div>

  <div class="estado" id="estado">
    Inicializando experiencia AR...
  </div>


  <a-scene
    mindar-image="
      imageTargetSrc: /ar/targets.mind;
      autoStart: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
  >

    <!-- ========================= -->
    <!-- ASSETS -->
    <!-- ========================= -->

    <a-assets timeout="30000">

      <a-asset-item
        id="personaje"
        src="/ar/personaje.glb"
      >
      </a-asset-item>

      <audio
        id="narracion"
        src="/ar/personaje.mp3"
        preload="auto"
      >
      </audio>

    </a-assets>


    <!-- ========================= -->
    <!-- ILUMINACIÓN -->
    <!-- ========================= -->

    <a-entity
      light="
        type: ambient;
        intensity: 1.5;
      "
    >
    </a-entity>

    <a-entity
      light="
        type: directional;
        intensity: 2;
      "
      position="1 2 1"
    >
    </a-entity>


    <!-- ========================= -->
    <!-- CÁMARA -->
    <!-- ========================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


    <!-- ========================= -->
    <!-- MARCADOR -->
    <!-- ========================= -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <!-- Modelo -->

      <a-gltf-model
        id="modelo"
        src="#personaje"

        position="0 0 0"

        rotation="0 180 0"

        scale="0.02 0.02 0.02"
      >
      </a-gltf-model>


      <!-- Cubo de diagnóstico -->

      <a-box
        id="cuboPrueba"

        position="0 0.3 0"

        scale="0.2 0.2 0.2"
      >
      </a-box>

    </a-entity>

  </a-scene>


  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const target =
        document.getElementById("target");

      const modelo =
        document.getElementById("modelo");

      const audio =
        document.getElementById("narracion");

      const estado =
        document.getElementById("estado");


      /* =========================
         MODELO CARGADO
      ========================= */

      modelo.addEventListener(
        "model-loaded",
        () => {

          console.log(
            "✅ GLB cargado correctamente"
          );

          estado.textContent =
            "Modelo 3D cargado";

        }
      );


      /* =========================
         ERROR DE MODELO
      ========================= */

      modelo.addEventListener(
        "model-error",
        (event) => {

          console.error(
            "❌ Error cargando GLB:",
            event
          );

          estado.textContent =
            "Error cargando modelo 3D";

        }
      );


      /* =========================
         MARCADOR DETECTADO
      ========================= */

      target.addEventListener(
        "targetFound",
        () => {

          console.log(
            "🎯 Marcador detectado"
          );

          estado.textContent =
            "Marcador detectado";

          audio.currentTime = 0;

          audio
            .play()
            .catch((error) => {

              console.warn(
                "Audio bloqueado:",
                error
              );

            });

        }
      );


      /* =========================
         MARCADOR PERDIDO
      ========================= */

      target.addEventListener(
        "targetLost",
        () => {

          console.log(
            "Marcador perdido"
          );

          estado.textContent =
            "Buscando marcador...";

        }
      );

    });

  </script>

</body>
</html>
